<div class="embed-root" [class.theme-light]="theme() === 'light'">
  <header class="embed-chrome">
    <span class="brand">MTP Chart</span>
    <span class="meta">{{ title() }}</span>
  </header>

  @if (loading()) {
    <div class="state">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading market data…</p>
    </div>
  } @else if (error()) {
    <div class="state error">
      <mat-icon>lock</mat-icon>
      <p>{{ error() }}</p>
    </div>
  } @else if (bars().length === 0) {
    <div class="state">
      <mat-icon>show_chart</mat-icon>
      <p>No candles returned for {{ symbol() }}.</p>
    </div>
  } @else {
    <div class="chart-host">
      <app-candlestick-chart
        [ohlcvData]="bars()"
        [theme]="theme()"
        [showToolbar]="false"
      ></app-candlestick-chart>
    </div>
  }
</div>
