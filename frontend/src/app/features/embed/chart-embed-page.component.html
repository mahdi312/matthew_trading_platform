<div class="embed-root" [class.theme-light]="theme() === 'light'">

  @if (loading()) {
    <div aria-live="polite" class="state" role="status">
      <mat-spinner diameter="36"></mat-spinner>
      <p>Loading chart…</p>
    </div>
  } @else if (error()) {
    <div class="state state--error" role="alert">
      <mat-icon aria-hidden="true">link_off</mat-icon>
      <p>{{ error() }}</p>
    </div>
  } @else if (bars().length === 0) {
    <div class="state" role="status">
      <mat-icon aria-hidden="true">show_chart</mat-icon>
      <p>No chart data available for {{ symbol() }}.</p>
    </div>
  } @else {
    <div class="chart-host">
      <app-candlestick-chart
        [ohlcvData]="bars()"
        [theme]="theme()"
        [showToolbar]="false"
      ></app-candlestick-chart>
    </div>
  }

  <!-- Tiny, unobtrusive attribution — present enough to identify the
       platform, small enough to never compete with the chart itself. -->
  <div aria-hidden="true" class="embed-attribution">
    <span class="embed-attribution__dot"></span>
    MTP
  </div>
</div>
