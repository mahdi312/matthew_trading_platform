# ── Matthew Trading Platform — Docker Compose (Step 15) ───────────────────────
#
# Full multi-service stack: discovery, gateway, all microservices,
# Kafka + ZooKeeper, Redis, and PostgreSQL.
#
# USAGE (development):
#   docker compose up -d
#
# For local dev *before* Step 15 is reached you can spin up individual
# infrastructure components only:
#   # Redis L2 cache (market-service + reference-data-service)
#   docker run -d -p 6379:6379 --name mtp-redis redis:7-alpine
#   # Kafka + ZooKeeper (alert-service, notification-service, trading-service)
#   docker compose up -d zookeeper kafka
#
# Environment variables:
#   All secrets (API keys, DB passwords) are loaded from a .env file
#   (see .env.example). Never commit real credentials.

version: "3.9"

services:

  # ── Infrastructure: ZooKeeper (required by Kafka) ──────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: mtp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped
    healthcheck:
      # ruok is not in the default 4lw whitelist on cp-zookeeper 7.5; srvr is.
      test: ["CMD", "bash", "-c", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Infrastructure: Kafka ──────────────────────────────────────────────────
  # Host port 9092 (not 9092): Windows Hyper-V often reserves 9081–9180.
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: mtp-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Pre-create topics used by the platform
      KAFKA_CREATE_TOPICS: "alerts.triggered:1:1,trades.executed:1:1,trades.closed:1:1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Infrastructure: Redis (L2 shared cache) ────────────────────────────────
  #
  # Used by:
  #   - market-service   (OhlcvCacheService — L2 OHLCV + ticker caches)
  #   - reference-data-service (RefDataCacheService — L2 news/fundamentals/
  #                              sentiment/calendar/search/NFT caches)
  #
  # Two-tier pattern: Caffeine (L1, in-JVM, sub-millisecond) sits in front of
  # Redis (L2, shared across instances). A full cache miss in both tiers falls
  # through to the provider registry.
  #
  # For local dev without the full stack:
  #   docker run -d -p 6379:6379 --name mtp-redis redis:7-alpine
  redis:
    image: redis:7-alpine
    container_name: mtp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    # Persist data across restarts (AOF + RDB snapshot)
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Infrastructure: PostgreSQL (Step 14 — replace H2 with real DB) ─────────
  postgres:
    image: postgres:16-alpine
    container_name: mtp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mtp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: mahdi.mostafavi312@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - app-network
  # ── Service registry (Eureka) ──────────────────────────────────────────────
  discovery-service:
    build:
      context: .
      dockerfile: infra/discovery-service/Dockerfile
    container_name: mtp-discovery
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Config Server (Spring Cloud Config, native profile) ────────────────────
  config-service:
    build:
      context: .
      dockerfile: infra/config-service/Dockerfile
    container_name: mtp-config
    env_file:
      - .env
    ports:
      - "8888:8888"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── API Gateway ────────────────────────────────────────────────────────────
  gateway-service:
    build:
      context: .
      dockerfile: infra/gateway-service/Dockerfile
    container_name: mtp-gateway
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
    restart: unless-stopped

  # ── market-service ─────────────────────────────────────────────────────────
  market-service:
    build:
      context: .
      dockerfile: services/market-service/Dockerfile
    container_name: mtp-market
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mtp_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mtp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mtp_secret}
      # API keys from .env
      ALPHAVANTAGE_KEY: ${ALPHAVANTAGE_KEY:-}
      COINGECKO_KEY: ${COINGECKO_KEY:-}
      COINMARKETCAP_KEY: ${COINMARKETCAP_KEY:-}
      POLYGON_KEY: ${POLYGON_KEY:-}
      MARKETSTACK_KEY: ${MARKETSTACK_KEY:-}
      FINNHUB_KEY: ${FINNHUB_KEY:-}
      TWELVEDATA_KEY: ${TWELVEDATA_KEY:-}
      FIXERIO_KEY: ${FIXERIO_KEY:-}
      FREECURRENCYAPI_KEY: ${FREECURRENCYAPI_KEY:-}
      CURRENCYLAYER_KEY: ${CURRENCYLAYER_KEY:-}
      EXCHANGERATEAPI_KEY: ${EXCHANGERATEAPI_KEY:-}
      OPENEXCHANGERATES_KEY: ${OPENEXCHANGERATES_KEY:-}
      BITUNIX_API_KEY: ${BITUNIX_API_KEY:-}
      BITUNIX_SECRET_KEY: ${BITUNIX_SECRET_KEY:-}
    restart: unless-stopped

  # ── reference-data-service ─────────────────────────────────────────────────
  reference-data-service:
    build:
      context: .
      dockerfile: services/reference-data-service/Dockerfile
    container_name: mtp-reference
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_KEY:-}
      TWELVEDATA_API_KEY: ${TWELVEDATA_KEY:-}
      CMC_API_KEY: ${COINMARKETCAP_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_KEY:-}
    restart: unless-stopped

  # ── trading-service ─────────────────────────────────────────────────────────
  trading-service:
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    container_name: mtp-trading
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mtp_trading
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mtp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mtp_secret}
      BITUNIX_API_KEY: ${BITUNIX_API_KEY:-}
      BITUNIX_SECRET_KEY: ${BITUNIX_SECRET_KEY:-}
    restart: unless-stopped

  # ── alert-service ──────────────────────────────────────────────────────────
  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: mtp-alert
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mtp_alert
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mtp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mtp_secret}
    restart: unless-stopped

  # ── notification-service ───────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: mtp-notification
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL_TO:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-TradingBot}
      TELEGRAM_BOT_CHAT_IDS: ${TELEGRAM_BOT_CHAT_IDS:-}
    restart: unless-stopped

  # ── identity-service ───────────────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: mtp-identity
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mtp_identity
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mtp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mtp_secret}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
    restart: unless-stopped

  # ── ai-service ─────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: mtp-ai
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
    ports:
      - "8089:8089"
    environment:
      CONFIG_SERVER_URI: http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVICES_MARKET_URL: http://market-service:8082
      SERVICES_REFERENCE_DATA_URL: http://reference-data-service:8085
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

  # ── Angular frontend (nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtp-frontend
    depends_on:
      - gateway-service
    ports:
      - "4200:80"
    environment:
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-http://localhost:8080}
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  app-network: