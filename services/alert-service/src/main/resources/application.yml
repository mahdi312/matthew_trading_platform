server:
  port: 8087

spring:
  application:
    name: alert-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtp_alert}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:mtp}
    password: ${SPRING_DATASOURCE_PASSWORD:mtp_secret}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema now — Hibernate only checks it matches
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # ── Kafka producer (AlertTriggeredEventDto → alerts.triggered) ─────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── Alert evaluation loop ────────────────────────────────────────────────────
app:
  alert:
    poll-interval-ms: ${ALERT_POLL_INTERVAL_MS:10000}

# ── Eureka client ─────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

# Resilience4j circuit breaker defaults for the OhlcvDataProvider registry
# used by AlertEvaluationService (Steps 4/4.5 pattern).
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80


logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"