server:
  port: 8082

spring:
  application:
    name: market-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtp_market}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:mtp}
    password: ${SPRING_DATASOURCE_PASSWORD:mtp_secret}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema now — Hibernate only checks it matches
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Two-tier cache: Caffeine L1 (in-JVM) + Redis L2 (shared) ───────────────
  #
  # L1 (Caffeine) — sub-millisecond reads, local to this JVM instance only.
  #   Configured as plain Caffeine.Cache beans in CacheConfig; used directly
  #   by OhlcvCacheService (not via @Cacheable) so the L1→L2→provider flow
  #   is explicit.
  #
  # L2 (Redis) — shared across all instances, survives restarts.
  #   Wired as the primary Spring CacheManager (RedisCacheManager) in CacheConfig.
  #   spring.cache.type=redis tells Spring Boot to defer to that bean.
  #
  # For local dev: docker run -p 6379:6379 redis:7-alpine
  # For production / Step 15: the redis service in docker-compose.yml
  cache:
    type: redis

  # ── Redis connection (Lettuce, auto-configured by spring-boot-starter-data-redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Lettuce connection pool (optional; defaults are fine for dev)
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# ── External market-data provider API keys (Phase 3) ────────────────────────
# All keys default to "" (empty). Providers with blank keys are auto-disabled.
# Set env vars (e.g. ALPHAVANTAGE_KEY=xxx) to enable the corresponding provider.
api:
  # Crypto
  alphavantage-key: ${ALPHAVANTAGE_KEY:}
  coingecko-key: ${COINGECKO_KEY:}
  coinmarketcap-key: ${COINMARKETCAP_KEY:}
  # Stock
  polygon-key: ${POLYGON_KEY:}
  marketstack-key: ${MARKETSTACK_KEY:}
  finnhub-key: ${FINNHUB_KEY:}
  twelvedata-key: ${TWELVEDATA_KEY:}
  # Forex
  fixerio-key: ${FIXERIO_KEY:}
  freecurrencyapi-key: ${FREECURRENCYAPI_KEY:}
  currencylayer-key: ${CURRENCYLAYER_KEY:}
  exchangerateapi-key: ${EXCHANGERATEAPI_KEY:}
  openexchangerates-key: ${OPENEXCHANGERATES_KEY:}
  # Provider base URLs (defaults; override per-env if needed)
  binance:
    base-url: ${BINANCE_BASE_URL:https://api.binance.com}
    fallback-url: ${BINANCE_FALLBACK_URL:https://data-api.binance.vision}
  coingecko:
    base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
  yahoo:
    base-url: ${YAHOO_BASE_URL:https://query1.finance.yahoo.com}
  frankfurter:
    base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.app}

# ── OHLCV provider HTTP client settings (Phase 3) ───────────────────────────
market:
  provider:
    http:
      connect-timeout-secs: ${MARKET_HTTP_CONNECT_TIMEOUT:5}
      read-timeout-secs: ${MARKET_HTTP_READ_TIMEOUT:15}
      call-timeout-secs: ${MARKET_HTTP_CALL_TIMEOUT:30}

# ── Market data sync scheduler (Phase 3) ─────────────────────────────────────
# Set to true to enable the live-chart sync background job once Phase 3
# provider beans are fully wired and API keys are configured.
app:
  market-data:
    sync:
      enabled: ${MARKET_SYNC_ENABLED:false}

# ── Cache TTL tuning (L1 Caffeine / L2 Redis) ────────────────────────────────
# Override via env vars, e.g.:
#   CACHE_CAFFEINE_OHLCV_TTL_SECONDS=60
#   CACHE_REDIS_OHLCV_TTL_MINUTES=10
cache:
  caffeine:
    ohlcv-ttl-seconds: ${CACHE_CAFFEINE_OHLCV_TTL_SECONDS:30}
    ticker-ttl-seconds: ${CACHE_CAFFEINE_TICKER_TTL_SECONDS:5}
  redis:
    ohlcv-ttl-minutes: ${CACHE_REDIS_OHLCV_TTL_MINUTES:5}
    ticker-ttl-seconds: ${CACHE_REDIS_TICKER_TTL_SECONDS:10}

# ── BitUnix API configuration (Step 5.1) ────────────────────────────────────
# apiKey/secretKey are only needed for BitUnix's private endpoints (order
# placement, balances — trading-service, Step 6+). Kline/Tickers (Step 5.2)
# and the public WebSocket feed (Step 5.4) are unauthenticated.
bitunix:
  rest-base-url: ${BITUNIX_REST_BASE_URL:https://fapi.bitunix.com}
  ws-public-url: ${BITUNIX_WS_PUBLIC_URL:wss://fapi.bitunix.com/public/}
  ws-private-url: ${BITUNIX_WS_PRIVATE_URL:wss://fapi.bitunix.com/private/}
  api-key: ${BITUNIX_API_KEY:}
  secret-key: ${BITUNIX_SECRET_KEY:}
  rest-rate-limit-per-second: 10
  ws-rate-limit-per-second: 5
  ws-max-subscriptions: 300
  ws-ping-interval-seconds: 25

# ── Eureka client ────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ── Actuator (health + cache stats, Step 5.3) ───────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    caches:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"