server:
  port: 8083

spring:
  application:
    name: trading-service

  # ── H2 in-memory database (order persistence scaffold) ─────────────────────
  datasource:
    url: jdbc:h2:mem:tradingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false   # disable web console in production; enable locally if needed

  # ── Kafka producer (trades.executed / trades.closed — Step 8) ─────────────
  # TradeEventPublisher publishes TradeEventDto events so notification-service
  # can fan out email/Telegram notifications on trade lifecycle changes.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ── Reference-data-service URL (Step 10 — FundamentalsClient) ────────────────
# Resolved via Eureka in a full cluster; set this property for local / Docker
# non-Eureka environments.  Leave blank to rely on Eureka service discovery.
reference-data:
  service:
    url: ${REFERENCE_DATA_SERVICE_URL:}

# ── OpenFeign / circuit-breaker ───────────────────────────────────────────────
# Enable feign circuit-breaker so FundamentalsClientFallback is used when
# reference-data-service is unreachable.
feign:
  circuitbreaker:
    enabled: true

# ── BitUnix API configuration (TradingProperties, Step 6.6) ──────────────────
#
# Two distinct REST base URLs and one private WebSocket URL:
#   futures-base-url  → https://fapi.bitunix.com      (perpetual futures)
#   spot-base-url     → https://openapi.bitunix.com   (spot market)
#   ws-private-url    → wss://openapi.bitunix.com:443/ws-api/v1  (futures WS)
#
# Credentials: set via environment variables in production.
# The api-key / secret-key here are single-user ("global") defaults used by
# BitUnixTradingProvider.resolveCredential() until per-user identity-service
# integration is added (Step 8+).
#
# Override any of these values with environment variables using Spring's
# relaxed binding, e.g.:
#   BITUNIX_BITUNIX_API_KEY=...
#   BITUNIX_BITUNIX_SECRET_KEY=...
bitunix:
  futures-base-url: https://fapi.bitunix.com
  spot-base-url: https://openapi.bitunix.com
  ws-private-url: wss://openapi.bitunix.com:443/ws-api/v1
  bitunix-api-key: ${BITUNIX_API_KEY:}
  bitunix-secret-key: ${BITUNIX_SECRET_KEY:}
  rest-rate-limit-per-second: 10
  ws-rate-limit-per-second: 5
  ws-max-subscriptions: 300
  ws-ping-interval-seconds: 25
  max-leverage: 125
