server:
  port: 8085

# ── External API keys ──────────────────────────────────────────────────────────
# All keys default to empty string so the application starts without them.
# Set the corresponding environment variables to activate each provider.
# Providers with empty keys are skipped at runtime (has*Key() guard returns false).
api:
  alphavantage-key: ${ALPHAVANTAGE_API_KEY:}
  finnhub-key: ${FINNHUB_API_KEY:}
  twelvedata-key: ${TWELVEDATA_API_KEY:}
  coinmarketcap-key: ${CMC_API_KEY:}
  coingecko-key: ${COINGECKO_API_KEY:}

spring:
  application:
    name: reference-data-service

  # ── Two-tier cache: Caffeine L1 (in-JVM) + Redis L2 (shared) ───────────────
  # reference-data-service is the heaviest external-API consumer
  # (news, fundamentals, calendar, sentiment, search, NFT) — all calls are
  # rate-limited, so the two-tier pattern saves re-hitting providers on
  # cold instances or restarts.
  #   L1 (Caffeine): sub-millisecond, local-only, configured in RefDataCacheConfig.
  #   L2 (Redis):    shared across instances, survives restarts, longer TTL.
  # For local dev: docker run -p 6379:6379 redis:7-alpine
  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# ── Cache TTL tuning (L1 Caffeine / L2 Redis for reference-data-service) ──────
# All provider responses are expensive external HTTP calls — long-ish TTLs
# are intentional to respect rate limits.
cache:
  caffeine:
    # L1 TTLs (seconds) — short because these are per-JVM
    news-ttl-seconds: ${CACHE_CAFFEINE_NEWS_TTL_SECONDS:120}
    fundamentals-ttl-seconds: ${CACHE_CAFFEINE_FUNDAMENTALS_TTL_SECONDS:300}
    sentiment-ttl-seconds: ${CACHE_CAFFEINE_SENTIMENT_TTL_SECONDS:60}
    calendar-ttl-seconds: ${CACHE_CAFFEINE_CALENDAR_TTL_SECONDS:300}
    search-ttl-seconds: ${CACHE_CAFFEINE_SEARCH_TTL_SECONDS:60}
    nft-ttl-seconds: ${CACHE_CAFFEINE_NFT_TTL_SECONDS:120}
  redis:
    # L2 TTLs (minutes) — longer because Redis is shared
    news-ttl-minutes: ${CACHE_REDIS_NEWS_TTL_MINUTES:10}
    fundamentals-ttl-minutes: ${CACHE_REDIS_FUNDAMENTALS_TTL_MINUTES:60}
    sentiment-ttl-minutes: ${CACHE_REDIS_SENTIMENT_TTL_MINUTES:5}
    calendar-ttl-minutes: ${CACHE_REDIS_CALENDAR_TTL_MINUTES:60}
    search-ttl-minutes: ${CACHE_REDIS_SEARCH_TTL_MINUTES:30}
    nft-ttl-minutes: ${CACHE_REDIS_NFT_TTL_MINUTES:15}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

# Resilience4j circuit breaker defaults for data providers.
# Per-provider overrides can be added under instances.<providerName>.
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"