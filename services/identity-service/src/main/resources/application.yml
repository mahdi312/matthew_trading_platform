server:
  port: 9898

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          tradingview:
            client-id: ${TRADINGVIEW_CLIENT_ID}
            client-secret: ${TRADINGVIEW_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          tradingview:
            authorization-uri: https://www.tradingview.com/oauth2/authorize
            token-uri: https://www.tradingview.com/oauth2/token
            user-info-uri: https://www.tradingview.com/oauth2/userinfo
            user-name-attribute: username

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
