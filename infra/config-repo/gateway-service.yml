jwt:
  secret: ${JWT_SECRET:change-me-in-production-at-least-32-chars}

# Comma-separated secret keys for detachable chart/widget embeds.
# Third-party hosts send X-Embed-Key (or ?embedKey=) to read OHLCV/indicators.
embed:
  api-keys: ${EMBED_API_KEYS:dev-embed-key-change-me}

# Browser SPA origins allowed to call the Gateway (Angular ng serve, etc.).
gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
