api:
  alphavantage-key: ${ALPHAVANTAGE_API_KEY:${ALPHAVANTAGE_KEY:}}
  finnhub-key: ${FINNHUB_API_KEY:${FINNHUB_KEY:}}
  twelvedata-key: ${TWELVEDATA_API_KEY:${TWELVEDATA_KEY:}}
  coinmarketcap-key: ${CMC_API_KEY:${COINMARKETCAP_KEY:}}
  coingecko-key: ${COINGECKO_API_KEY:${COINGECKO_KEY:}}

spring:
  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

cache:
  caffeine:
    news-ttl-seconds: ${CACHE_CAFFEINE_NEWS_TTL_SECONDS:120}
    fundamentals-ttl-seconds: ${CACHE_CAFFEINE_FUNDAMENTALS_TTL_SECONDS:300}
    sentiment-ttl-seconds: ${CACHE_CAFFEINE_SENTIMENT_TTL_SECONDS:60}
    calendar-ttl-seconds: ${CACHE_CAFFEINE_CALENDAR_TTL_SECONDS:300}
    search-ttl-seconds: ${CACHE_CAFFEINE_SEARCH_TTL_SECONDS:60}
    nft-ttl-seconds: ${CACHE_CAFFEINE_NFT_TTL_SECONDS:120}
  redis:
    news-ttl-minutes: ${CACHE_REDIS_NEWS_TTL_MINUTES:10}
    fundamentals-ttl-minutes: ${CACHE_REDIS_FUNDAMENTALS_TTL_MINUTES:60}
    sentiment-ttl-minutes: ${CACHE_REDIS_SENTIMENT_TTL_MINUTES:5}
    calendar-ttl-minutes: ${CACHE_REDIS_CALENDAR_TTL_MINUTES:60}
    search-ttl-minutes: ${CACHE_REDIS_SEARCH_TTL_MINUTES:30}
    nft-ttl-minutes: ${CACHE_REDIS_NFT_TTL_MINUTES:15}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"
