spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtp_trading}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:mtp}
    password: ${SPRING_DATASOURCE_PASSWORD:mtp_secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

reference-data:
  service:
    url: ${REFERENCE_DATA_SERVICE_URL:}

feign:
  circuitbreaker:
    enabled: true

bitunix:
  futures-base-url: https://fapi.bitunix.com
  spot-base-url: https://openapi.bitunix.com
  ws-private-url: wss://openapi.bitunix.com:443/ws-api/v1
  bitunix-api-key: ${BITUNIX_API_KEY:}
  bitunix-secret-key: ${BITUNIX_SECRET_KEY:}
  rest-rate-limit-per-second: 10
  ws-rate-limit-per-second: 5
  ws-max-subscriptions: 300
  ws-ping-interval-seconds: 25
  max-leverage: 125

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-no-cid}] %logger{36} - %msg%n"
