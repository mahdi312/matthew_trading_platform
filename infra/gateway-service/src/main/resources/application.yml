server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**,/api/profile/**,/api/admin/**,/oauth2/**

            - id: market-service
              uri: lb://market-service
              predicates:
                - Path=/api/market/**,/api/charts/**,/api/indicators/**,/ws-market/**

            - id: trading-service
              uri: lb://trading-service
              predicates:
                - Path=/api/trades/**,/api/portfolio/**,/api/reports/**

            - id: reference-data-service
              uri: lb://reference-data-service
              predicates:
                - Path=/api/reference/**

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**

            - id: alert-service
              uri: lb://alert-service
              predicates:
                - Path=/api/alerts/**,/ws/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
