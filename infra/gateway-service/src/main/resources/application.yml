server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # ── Routes ──────────────────────────────────────────────────────────
          # JWT validation is handled globally by GatewayJwtAuthFilter before
          # any route is matched. Public paths (/auth/**, /oauth2/**, /actuator/**)
          # are whitelisted in the filter itself.
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/auth/**,/oauth2/**

            - id: market-service
              uri: lb://market-service
              predicates:
                - Path=/api/market/**

            - id: trading-service
              uri: lb://trading-service
              predicates:
                - Path=/api/trading/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

# ── JWT — must match identity-service's jwt.secret ──────────────────────────
# Override via environment variable or Config Server. Never commit real secrets.
jwt:
  secret: ${JWT_SECRET:change-me-in-production-at-least-32-chars}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
