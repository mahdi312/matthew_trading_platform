#
# Activated with: SPRING_PROFILES_ACTIVE=docker
# Used by docker-compose and when connecting a host-run app to containerized Postgres.
#
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading_platform}
spring.datasource.username=${POSTGRES_USER:trading}
spring.datasource.password=${POSTGRES_PASSWORD:trading}
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL dialect is auto-detected from the JDBC URL above.
spring.jpa.hibernate.ddl-auto=update
# Harmless one-shot notices when ddl-auto=update reconciles indexes on first boot.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
# Increased from 10 → 20 as a temporary measure while connection-leak investigation
# is ongoing. The root-cause fixes (AlertService, CoinGeckoNftService) reduce
# contention, but the larger pool prevents exhaustion spikes in the meantime.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Log a stack trace for any connection held longer than 60 seconds.
spring.datasource.hikari.leak-detection-threshold=60000

app.market-data.dynamic-tables.enabled=true
app.market-data.sync.enabled=true
