apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: mtp
spec:
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: config-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: mtp/config-service:latest
          ports:
            - containerPort: 8888
