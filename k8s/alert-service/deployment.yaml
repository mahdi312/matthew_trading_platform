apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: mtp
spec:
  ports:
    - port: 8087
      targetPort: 8087
  selector:
    app: alert-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
    spec:
      containers:
        - name: alert-service
          image: mtp/alert-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: mtp-shared-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mtp_alert
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: POSTGRES_PASSWORD
