apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: mtp
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: discovery-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: mtp/discovery-service:latest
          ports:
            - containerPort: 8761
          env:
            - name: CONFIG_SERVER_URI
              valueFrom:
                configMapKeyRef:
                  name: mtp-shared-config
                  key: CONFIG_SERVER_URI
            - name: EUREKA_HOSTNAME
              value: discovery-service
