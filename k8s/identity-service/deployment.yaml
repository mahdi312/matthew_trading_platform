apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: mtp
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: identity-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: mtp/identity-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mtp-shared-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mtp_identity
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: JWT_SECRET
