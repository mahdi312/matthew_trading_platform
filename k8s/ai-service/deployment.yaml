apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: mtp
spec:
  ports:
    - port: 8089
      targetPort: 8089
  selector:
    app: ai-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: mtp/ai-service:latest
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: mtp-shared-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: OPENAI_API_KEY
            - name: SERVICES_MARKET_URL
              value: http://market-service:8082
            - name: SERVICES_REFERENCE_DATA_URL
              value: http://reference-data-service:8085
