apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: mtp
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: market-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  namespace: mtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
    spec:
      containers:
        - name: market-service
          image: mtp/market-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: mtp-shared-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mtp_market
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: POSTGRES_PASSWORD
            - name: ALPHAVANTAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: ALPHAVANTAGE_KEY
            - name: BITUNIX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: BITUNIX_API_KEY
            - name: BITUNIX_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: BITUNIX_SECRET_KEY
