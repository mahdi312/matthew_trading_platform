apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: mtp
data:
  init-databases.sql: |
    CREATE DATABASE mtp_identity;
    CREATE DATABASE mtp_market;
    CREATE DATABASE mtp_trading;
    CREATE DATABASE mtp_alert;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mtp
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mtp
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mtp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: mtp
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
